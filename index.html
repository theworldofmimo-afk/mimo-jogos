:root{--navy:#19296a;--gold:#d9b55e;--gold2:#f3dc96;--cream:#fffaf0;--coral:#f47c4c;--teal:#3cbfb0;--pink:#f49fb6;--sky:#6f8ff0;--leaf:#5fb36b;--line:#e6e8f2;--muted:#6b7194}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);font-family:Q,system-ui,sans-serif;font-weight:500;color:var(--navy)}
button{font-family:inherit;font-weight:700;color:inherit;border:0;cursor:pointer;background:none}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .b{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:20px}
.top .tt{flex:1;min-width:0}.top .br{font-family:S;color:var(--gold2);font-size:16px;line-height:1}.top h1{margin:0;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{background:var(--gold2);color:var(--navy);border-radius:999px;padding:6px 12px;font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:18px;display:flex;align-items:center;gap:10px;overflow:hidden;position:relative}
.hero h2{margin:4px 0 6px;font-size:24px;line-height:1.1}.hero p{margin:0;color:#dfe4ff;font-size:14px}.hero img{width:120px;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gc{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px;text-align:left;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:4px;min-height:150px;position:relative}
.gc img{height:70px;object-fit:contain;align-self:flex-end;margin-top:auto}.gc .e{font-size:26px}.gc b{font-size:16px}.gc small{color:var(--muted);font-size:12.5px;font-weight:500}
.gc .new{position:absolute;top:10px;right:10px;background:var(--coral);color:#fff;font-size:11px;border-radius:999px;padding:2px 8px}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0 12px}
.seg button{background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px}.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{display:inline-block;background:var(--coral);color:#fff;border-radius:16px;padding:12px 18px;font-size:17px;box-shadow:0 4px 0 #c95d33}
.btn.g{background:var(--leaf);box-shadow:0 4px 0 #3f8a4c}.btn.w{background:#fff;color:var(--navy);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.q{font-size:19px;text-align:center;margin:6px 0 12px;line-height:1.3}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opts button{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 8px;font-size:18px;box-shadow:0 3px 0 var(--line)}
.opts button.ok{background:#e3f4e6;border-color:var(--leaf)}.opts button.no{background:#fde3ea;border-color:var(--pink)}
.fb{text-align:center;font-size:18px;min-height:28px;margin:10px 0}
.mem{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}@media(min-width:620px){.mem{grid-template-columns:repeat(6,1fr)}}
.fl{aspect-ratio:1;perspective:600px}.fl .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}.fl.up .in,.fl.done .in{transform:rotateY(180deg)}
.fl .fa,.fl .ba{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.fl .ba{background:var(--navy);border:2px solid var(--gold)}.fl .ba span{font-family:S;color:var(--gold2);font-size:20px}
.fl .fa{background:#fff;border:2px solid var(--gold);transform:rotateY(180deg);padding:4px}.fl .fa img{width:90%;height:90%;object-fit:contain}.fl .fa .w{font-size:14px;line-height:1.15}.fl .fa .w i{display:block;color:#b8913a;font-size:12px;margin-top:3px}
.fl.done .fa{background:#f2fbf3;border-color:var(--leaf)}
.clockbox{display:flex;justify-content:center}.clockbox svg{width:min(78vw,330px);height:auto;touch-action:none;user-select:none}
.big{font-size:42px;font-weight:700;text-align:center}
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:60px;background:#f6f3ea;border-radius:16px;padding:8px;margin:8px 0}
.money{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.coin{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,#d7b05a);border:3px solid #a07c33;font-size:14px}
.coin.s{background:radial-gradient(circle at 35% 30%,#fafbff,#b9bcc6);border-color:#e2c27a}.coin.c{background:radial-gradient(circle at 35% 30%,#ffe2cc,#c98a5e);border-color:#8f5a35}
.note{width:86px;height:50px;border-radius:8px;font-size:16px;border:2px solid rgba(25,41,106,.3)}
.items{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.it{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;min-width:86px}.it .e{font-size:32px}.it .p{background:var(--coral);color:#fff;border-radius:8px;padding:2px 6px;font-size:13px;display:inline-block;margin-top:3px}
.bar{height:16px;border-radius:9px;background:#fde8ee;overflow:hidden}.bar i{display:block;height:100%;background:var(--pink);transition:width .4s}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.pill{background:#eef2ff;border-radius:999px;padding:6px 12px;font-weight:700}
.sea{display:grid;gap:3px;grid-template-columns:repeat(6,1fr);max-width:330px;margin:0 auto}.sea div{aspect-ratio:1;border-radius:6px;background:#e8f0ff;display:flex;align-items:center;justify-content:center;font-size:18px}
.sea.t div{background:#eaf3ff;cursor:pointer}.sea div.b{background:#9fb0de}.sea div.h{background:var(--coral);color:#fff}.sea div.m{background:#fff;color:var(--sky)}.sea div.k{background:#a63b22;color:#fff}
.pie svg{width:min(70vw,260px);height:auto}
.conf{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}.chart div{flex:1;background:var(--pink);border-radius:4px 4px 0 0;position:relative}.chart div.w{background:var(--gold)}
.muted{color:var(--muted);font-size:14px;text-align:center}
.wrap{position:relative;z-index:1}
.gc .new.lk{background:var(--navy);font-size:12px;padding:2px 7px}
.lock{position:fixed;inset:0;z-index:80;background:rgba(25,41,106,.55);display:flex;align-items:center;justify-content:center;padding:18px}
.lock .bx{background:#fff;border-radius:22px;max-width:380px;width:100%;padding:20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.lock input{width:100%;font:inherit;font-size:20px;font-weight:700;text-align:center;letter-spacing:2px;border:2px solid var(--line);border-radius:14px;padding:12px;margin:12px 0 6px;text-transform:uppercase;color:var(--navy)}
.lock a{color:var(--coral);font-weight:700}

.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.sky span{position:absolute;top:-30px;color:var(--gold);text-shadow:0 0 6px rgba(217,181,94,.6);animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translateY(110vh) rotate(200deg);opacity:.15}}
.tog{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tog button{background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 12px;font-size:13px}.tog button.on{background:var(--gold2);color:var(--navy)}
.np{font-size:12px;color:var(--gold2);margin-top:6px;min-height:15px}
.mfab{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;width:40px;height:40px;border-radius:50%;background:rgba(25,41,106,.85);color:#fff;font-size:17px;box-shadow:0 6px 16px rgba(25,41,106,.3)}

.lang{flex:none;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:5px 8px;font-size:12px;letter-spacing:.5px}.lang b{color:var(--gold2)}.lm{position:fixed;top:calc(58px + env(safe-area-inset-top));right:12px;z-index:70;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(25,41,106,.25);padding:6px;display:flex;flex-direction:column;min-width:160px}.lm button{text-align:left;padding:11px 12px;border-radius:12px;font-size:16px}.lm button.on{background:var(--gold2)}
</style></head><body>

let SEA=null;const N=6,FLEET=[3,2,2,1];

let AC=null,master=null,curSong=null,mOn=store.get('music',true),jbIdx=Math.floor(Math.random()*5),duckT=null;const MVOL=.2;
function ac(){if(!AC){const Cc=window.AudioContext||window.webkitAudioContext;if(!Cc)return null;AC=new Cc();master=AC.createGain();master.gain.value=MVOL;
 const dl=AC.createDelay(),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.27;fb.gain.value=.28;wet.gain.value=.2;master.connect(AC.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AC.destination)}
 if(AC.state==='suspended')AC.resume();return AC}
function nfreq(n){const m=n.match(/^([A-G])(#|b)?(\d)$/);const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 440*Math.pow(2,((+m[3]+1)*12+b-69)/12)}
function bell(t,f,dur,out,vol=.3){const len=Math.max(.55,dur*1.7),g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+len);g.connect(out);
 [[1,'sine',1],[2,'sine',.32],[3,'sine',.1],[1,'triangle',.22]].forEach(([mul,type,amp])=>{const o=AC.createOscillator(),og=AC.createGain();o.type=type;o.frequency.value=f*mul;og.gain.value=amp;o.connect(og);og.connect(g);o.start(t);o.stop(t+len+.05)})}
function playSong(k,onEnd){stopSong();const a=ac();if(!a)return;const sg=SONGS[k],out=a.createGain();out.connect(master);const beat=60/sg.tempo,mul=Math.pow(2,sg.oct||0);let t=a.currentTime+.1;
 sg.notes.trim().split(/\s+/).forEach(tok=>{const[n,d]=tok.split(':'),du=parseFloat(d)*beat;if(n!=='R')bell(t,nfreq(n)*mul,du,out);t+=du});
 curSong={k,out,timer:setTimeout(()=>{curSong=null;syncMusic();onEnd&&onEnd()},(t-a.currentTime)*1000+400)};syncMusic()}
function stopSong(){if(!curSong)return;clearTimeout(curSong.timer);const o=curSong.out;try{o.gain.setTargetAtTime(0,AC.currentTime,.05);setTimeout(()=>o.disconnect(),500)}catch(e){}curSong=null}

 document.body.appendChild(d);const inp=$('#kc');setTimeout(()=>inp.focus(),50);
